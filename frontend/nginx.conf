server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: client-side routes fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed Vite assets aggressively; HTML always revalidated
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Cheap liveness for Docker / future Jenkins health probes
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
}
