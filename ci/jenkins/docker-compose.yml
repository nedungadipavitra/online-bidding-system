# Minimal local Jenkins for OBS pipelines (Docker Desktop / WSL2).
# Usage (from monorepo root):
#   docker compose -f ci/jenkins/docker-compose.yml up -d --build
# UI: http://localhost:9090
#
# Host Docker socket is mounted so builds use Docker Desktop's engine.

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obs-jenkins
    # Docker Desktop mounts docker.sock as root-only for the default jenkins user.
    # For local CI, run controller as root so docker CLI can call the API.
    # (Do not use this pattern on a multi-tenant shared Jenkins.)
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
      # Jenkins home when running as root still uses the same volume path.
    volumes:
      - obs_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Extra: membership for engines that expose a docker group on the socket.
      - "0"
    restart: unless-stopped

volumes:
  obs_jenkins_home:
