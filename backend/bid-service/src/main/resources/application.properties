spring.application.name=bid-service
server.port=8085

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bidding_bid_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
product.service-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
wallet.service-url=${WALLET_SERVICE_URL:http://localhost:8083}
wallet.internal-token=${WALLET_INTERNAL_TOKEN}
jwt.secret=${JWT_SECRET}
