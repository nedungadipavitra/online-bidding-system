server:
  port: 8085

spring:
  application:
    name: bid-service

  datasource:
    # Shared RDS obs-db: host/port/user/pass from /obs/prod/; schema is bid-specific.
    url: jdbc:mysql://${db.host}:${db.port}/bidding_bid_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${db.username}
    password: ${db.password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Prod only (Docker/Jenkins: SPRING_PROFILES_ACTIVE=prod).
  # /obs/prod/  → shared db.host, db.port, db.username, db.password
  # /obs/bid/   → product.service-url, wallet.*, jwt.secret (no db.* duplicates)
  config:
    import:
      - aws-parameterstore:/obs/prod/
      - aws-parameterstore:/obs/bid/

product:
  service-url: ${product.service-url}

wallet:
  service-url: ${wallet.service-url}
  internal-token: ${wallet.internal-token}

jwt:
  secret: ${jwt.secret}

management:
  endpoints:
    access:
      default: unrestricted
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      access: unrestricted
      probes:
        enabled: true

# aws.region comes from Parameter Store /obs/prod/aws/region (via /obs/prod/ import).
# Do not hardcode here — it would override SSM.
