server: 
  port: 8082

spring: 
  application: 
    name: product-service 

  datasource: 
    url: jdbc:mysql://${db.host}:${db.port}/${db.name}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver 
    username: ${db.username} 
    password: ${db.password}

  jpa: 
    database-platform: org.hibernate.dialect.MySQLDialect 
    show-sql: true 
    hibernate: 
      ddl-auto: update

  config: 
    import: 
      aws-parameterstore:/obs/prod/
 
  servlet:
    multipart: 
      max-file-size: 10MB 
      max-request-size: 10MB

aws: 
  region: ap-south-1

s3:
  bucket: ${s3.bucket}
  base-path: ${s3.base-path}

































































































