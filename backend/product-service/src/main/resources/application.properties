server.port=8082

spring.application.name=product-service

# DB credentials come from AWS Parameter Store (/obs/prod/) in cloud;
# local runs need those params (or SSM available) unless you override with env.
spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# From main: avoid open session in view lag; fine for this REST service.
spring.jpa.open-in-view=false

spring.config.import=aws-parameterstore:/obs/prod/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

aws.region=ap-south-1

s3.bucket=${s3.bucket}
s3.base-path=${s3.base-path}
