server.port=8082

spring.application.name=product-service

# Default / local: no Parameter Store (so unit tests and local boots work without AWS).
# Production container uses --spring.profiles.active=prod → application-prod.yml imports SSM.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:online_bidding}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:manager}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

aws.region=${AWS_REGION:ap-south-1}

s3.bucket=${S3_BUCKET:local-bucket}
s3.base-path=${S3_BASE_PATH:products/}
