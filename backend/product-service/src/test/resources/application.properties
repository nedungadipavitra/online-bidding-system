# Test profile: never call AWS Parameter Store or real MySQL.
# Controller unit tests don't load this; only @SpringBootTest contextLoads does.

spring.datasource.url=jdbc:h2:mem:product;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dummy cloud props so S3Config / @Value still bind without SSM.
aws.region=ap-south-1
s3.bucket=test-bucket
s3.base-path=test/
