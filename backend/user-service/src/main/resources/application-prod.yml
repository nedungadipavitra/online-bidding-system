server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    # Shared RDS obs-db: host/port/user/pass from /obs/prod/; schema is user-specific.
    url: jdbc:mysql://${db.host}:${db.port}/bidding_user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${db.username}
    password: ${db.password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Prod only (Docker/Jenkins: SPRING_PROFILES_ACTIVE=prod).
  # /obs/prod/  → shared db.host, db.port, db.username, db.password
  # /obs/user/  → jwt.secret, wallet.service-url, wallet.internal-token (no db.* duplicates)
  config:
    import:
      - aws-parameterstore:/obs/prod/
      - aws-parameterstore:/obs/user/

jwt:
  secret: ${jwt.secret}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

wallet:
  service-url: ${wallet.service-url}
  internal-token: ${wallet.internal-token}

# aws.region comes from Parameter Store /obs/prod/aws/region (via /obs/prod/ import).
# Do not hardcode here — it would override SSM.
