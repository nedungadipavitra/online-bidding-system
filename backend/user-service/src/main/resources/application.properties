# Default / local: no Parameter Store (unit tests and local boots work without AWS).
# Production container uses --spring.profiles.active=prod → application-prod.yml imports SSM.
spring.application.name=user-service

server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bidding_user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
wallet.service-url=${WALLET_SERVICE_URL:http://localhost:8083}
wallet.internal-token=${WALLET_INTERNAL_TOKEN}

# Comma-separated browser origins (Vite local default). Prod uses SSM /obs/user/cors/allowed-origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Deploy / Docker probe (Jenkins HEALTH_ENDPOINT). Boot 4: endpoint must be both exposed and accessible.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoints.access.default=unrestricted
management.endpoint.health.access=unrestricted
management.endpoint.health.probes.enabled=true
