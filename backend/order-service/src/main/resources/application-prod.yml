server:
  port: 8084

spring:
  application:
    name: order-service

  datasource:
    # Shared RDS obs-db: host/port/user/pass from /obs/prod/; schema is order-specific.
    url: jdbc:mysql://${db.host}:${db.port}/order_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${db.username}
    password: ${db.password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Prod only (Docker/Jenkins: SPRING_PROFILES_ACTIVE=prod).
  # Order has no extra secrets beyond shared DB — single import is enough.
  config:
    import:
      - aws-parameterstore:/obs/prod/

# aws.region comes from Parameter Store /obs/prod/aws/region (via /obs/prod/ import).
# Do not hardcode here — it would override SSM.
