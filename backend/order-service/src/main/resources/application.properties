# Default / local: no Parameter Store (unit tests and local boots work without AWS).
# Production container uses --spring.profiles.active=prod → application-prod.yml imports SSM.
spring.application.name=order-service
server.port=8084

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/order_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deploy / Docker probe (Jenkins HEALTH_ENDPOINT). Boot 4: endpoint must be both exposed and accessible.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoints.access.default=unrestricted
management.endpoint.health.access=unrestricted
management.endpoint.health.probes.enabled=true
