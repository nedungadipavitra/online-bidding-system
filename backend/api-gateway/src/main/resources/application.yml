spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: user-service-register-compat
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/register
              filters:
                - RewritePath=/register, /auth/register
            - id: user-service-login-compat
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/login
              filters:
                - RewritePath=/login, /auth/login
            - id: user-service-auth
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: user-service-users
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/users/**
            - id: product-service-products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/products/**
            - id: product-service-categories
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/categories/**
            - id: wallet-service-wallets
              uri: ${WALLET_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/wallets/**
            - id: wallet-service-transactions
              uri: ${WALLET_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/transactions/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/orders/**
            - id: bid-service
              uri: ${BID_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/bids/**
            # Native WebSocket clients connect to the exact /ws endpoint.
            - id: bid-service-websocket
              uri: ${BID_WEBSOCKET_URL:ws://localhost:8085}
              predicates:
                - Path=/ws
            # SockJS uses ordinary HTTP requests such as /ws/info and /ws/{session}/xhr.
            # Keep this route separate from the native WebSocket route so both transports
            # can reach the bid service through the gateway.
            - id: bid-service-sockjs
              uri: ${BID_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/ws/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

gateway:
  public-endpoints: POST:/auth/login,POST:/auth/register,POST:/auth/refresh,POST:/auth/logout,POST:/login,POST:/register,GET:/products/**,GET:/categories/**,GET:/ws,GET:/ws/**
  allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    health:
      probes:
        enabled: true
