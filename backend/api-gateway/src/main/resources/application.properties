spring.application.name=api-gateway
server.port=8080
jwt.secret=Z3V4aFJqSmVOUlVJbEZ2QzN3d0h0RkhzRWhWaVppcFVKaFVQMEVYeDliQjN0NQ==
gateway.public-endpoints=POST:/auth/login,POST:/auth/register,POST:/auth/refresh,POST:/auth/logout

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/users,/users/**

# Product Service
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/products,/products/**,/categories/**

# Wallet Service
spring.cloud.gateway.server.webflux.routes[2].id=wallet-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
