# Default / local: no Parameter Store (unit tests and local boots work without AWS).
# Production container uses --spring.profiles.active=prod → application-prod.yml imports SSM.
server.port=8083
spring.application.name=wallet-service
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bidding_wallet_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
internal.service-token=${WALLET_INTERNAL_TOKEN}

# Deploy / Docker probe (Jenkins HEALTH_ENDPOINT). Only health is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
